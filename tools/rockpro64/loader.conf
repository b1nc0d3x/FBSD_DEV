# Configure USB OTG; see usb_template(4).
hw.usb.template=3
#umodem_load="YES"
# Multiple console (serial+efi gop) enabled.
#boot_multicons="YES"
boot_serial="YES"
# Disable the beastie menu and color
beastie_disable="NO"
loader_color="NO"
#boot_verbose="YES"
autoboot_delay="3"
comconsole_speed="1500000"
console="comconsole"
#ddb.verbose_panic=1
rkfb_load="NO"
hw.rk3399_typec_dp_force="1"

# 2026-05-23 -- match rp64dbg USB-C DP tunables for replug auto-recovery
dev.rk_typec_phy.0.pin_assign="1"
dev.rk_typec_phy.1.pin_assign="1"
hw.fusb302.role_pref="0"
#hw.rk_drm.output="1"

hw.fusb302.skip_pd="1"

hw.rk_drm.dp_set_hdmi_en="1"
hw.fusb302.synth_pin="4"

# drmcompat Phase 4 DISABLED at loader 2026-06-07 — arm64 preload_protect panics
# in linker_preload (FAR=wild ptr) when modules come from loader.conf.  Live
# kldload works fine; load post-boot via rc.local instead of this path.

# Phase 9i — kms framework + rk_kms hardware driver as modules.
#kms_load="YES"
#rk_kms_load="YES"
if_bwn_load="NO"
kernel="kernel.brcm"
hw.rk_kms.attach_vblank_irq="1"
hw.fusb302.0.skip_pd="1"
es8316_load=YES

# HDMI audio nodes now live in an overlay, not the vendor dtsi.
# Required for pcm0 <hdmi-sound> to appear.
fdt_overlays="rk3399-rockpro64-hdmi-audio"
